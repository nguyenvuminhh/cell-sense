name: CICD Pipeline
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - develop-workflow

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Create and activate virtual environment
        run: |
          python -m venv .venv
          source .venv/bin/activate

      - name: Install dependencies
        run: |
          make install_prod

      - name: Run tests
        run: |
          make run_test
    
  deploy:
    needs: test
    runs-on: ubuntu-latest

    env:
      GCP_ACCOUNT_EMAIL: ${{ vars.GCP_ACCOUNT_EMAIL }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ARTIFACT_REGISTRY_REPO_NAME: ${{ vars.GCP_ARTIFACT_REGISTRY_REPO_NAME }}
      GCP_CLOUD_RUN_SERVICE_NAME: ${{ vars.GCP_CLOUD_RUN_SERVICE_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Run deploy
        run: make gcloud_deploy_to_cloud_run